<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Starke Design Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 1.2s ease-out;
        }

        .logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 3rem;
            opacity: 0;
            animation: logoFadeIn 1s ease-out 0.3s forwards;
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #1a1a1a;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
            animation: textFadeIn 1s ease-out 0.6s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .logo {
                max-width: 200px;
                margin-bottom: 2rem;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 0.1em;
            }
        }

        @media (max-width: 480px) {
            .logo {
                max-width: 160px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/LOGO.jpg" alt="Carol Logo" class="logo">
        <h1>Em Breve</h1>
    </div>
</body>

</html>
